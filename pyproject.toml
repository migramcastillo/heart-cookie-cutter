[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "heart_ccds"
version = "0.0.1"
description = "Heart disease project in modular format"
authors = [
  { name = "Miguel Castillo" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["heart_ccds"]
include = ["pyproject.toml", "heart_ccds/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["heart_ccds"]
force-sort-within-sections = true

